<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punch</title>
<meta name="description" content="punch. dma hardware dev, fortnite cheats, c++. founder of larphub.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="https://heyimpunch.xyz/">
<meta property="og:type" content="website">
<meta property="og:title" content="Punch">
<meta property="og:description" content="dma hardware dev, fortnite cheats, c++. founder of larphub.">
<meta property="og:url" content="https://heyimpunch.xyz/">
<meta property="og:image" content="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=512">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--red:#e8262a;--line:rgba(255,255,255,.22);--glass:rgba(8,8,8,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050505;color:#fff;font:400 15px/1.5 'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* background */
.bg{position:fixed;inset:-30px;z-index:-2;background:#050505 url("img/bg.jpg") center/cover no-repeat;filter:blur(7px) brightness(.62);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,1%)}}
.shade{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.7))}

/* enter */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;transition:opacity .6s,visibility .6s}
#gate.gone{opacity:0;visibility:hidden}
#gate span{font-size:1.15rem;font-weight:500;letter-spacing:.04em;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* layout */
.page{min-height:100svh;display:grid;place-items:center;padding:28px 14px}
.stack{width:min(440px,100%);perspective:1000px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);padding:22px;box-shadow:0 30px 80px -30px #000;transform-style:preserve-3d;transition:transform .15s ease-out;opacity:0;transform:translateY(14px);animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* top */
.top{display:flex;gap:18px;align-items:center}
.av{position:relative;flex:none;width:96px;height:96px}
.av::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--red),#5a0d0f,var(--red),#5a0d0f,var(--red));animation:spin 8s linear infinite}
.av img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1a1a1a;border:3px solid #0a0a0a}
.av .dot{position:absolute;right:0;bottom:2px;width:24px;height:24px;border-radius:50%;background:#6b6b6b;border:4px solid #0a0a0a}
.dot.online{background:#3ba55d}.dot.idle{background:#faa61a}.dot.dnd{background:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.who{min-width:0}
.name{font-size:2.1rem;font-weight:600;letter-spacing:-.01em;line-height:1.1;text-shadow:0 0 14px rgba(255,255,255,.25)}
.bio{font-weight:500;margin-top:6px;min-height:1.5em}
.bio i{display:inline-block;width:2px;height:1em;background:#fff;margin-left:2px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{font-size:.8rem;color:rgba(255,255,255,.6);font-style:italic;margin-top:2px}

/* presence */
.pres{display:flex;align-items:center;gap:14px;margin-top:20px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}
.pres img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#1a1a1a;flex:none}
.pres b{display:block;font-weight:600;line-height:1.2}
.pres span{display:block;font-size:.8rem;font-style:italic;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres div{min-width:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:.8rem;font-weight:500}

/* links */
.links{display:flex;justify-content:center;gap:12px;margin-top:20px}
.links a{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-weight:500;font-size:.9rem;transition:background .2s,transform .2s,border-color .2s}
.links a:hover{background:rgba(255,255,255,.16);transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.links a.main{background:var(--red);border-color:var(--red)}
.links a.main:hover{background:#ff3b3f}
.links svg{width:19px;height:19px;flex:none}

/* player */
.player{display:flex;align-items:center;gap:12px;margin-top:20px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}
.pbtn{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transition:transform .15s}
.pbtn:hover{transform:scale(1.08)}
.pbtn svg{width:16px;height:16px}
.bar{flex:1;display:flex;align-items:center;gap:9px;font-size:.72rem;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:18px;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.22) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;margin-top:-3.5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.22)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:#fff}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff}
#seek{flex:1;min-width:0}
#vol{width:58px;flex:none}
.vic{width:16px;height:16px;flex:none;color:rgba(255,255,255,.65)}

.foot{margin-top:18px;text-align:center;font-size:.72rem;color:rgba(255,255,255,.5)}
.foot b{font-weight:500;color:rgba(255,255,255,.8)}
.legal{margin-top:16px;text-align:center;font-size:.68rem;color:rgba(255,255,255,.35);padding:0 8px}

@media(max-width:420px){.av{width:82px;height:82px}.name{font-size:1.8rem}.links a{padding:10px 14px}#vol{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body class="locked">
<div class="bg" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>

<div id="gate" role="button" tabindex="0" aria-label="Click to enter"><span>click to enter</span></div>

<div class="page">
  <div class="stack">
    <main class="card" id="card">

      <div class="top">
        <div class="av">
          <img id="av" alt="" src="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=256">
          <span class="dot" id="dot"></span>
        </div>
        <div class="who">
          <h1 class="name">Punch</h1>
          <p class="bio"><span id="typed"></span><i></i></p>
          <p class="sub">founder of larphub</p>
        </div>
      </div>

      <div class="pres" aria-live="polite">
        <img id="pav" alt="" src="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=128">
        <div><b id="pname">Punch</b><span id="pstat">connecting...</span></div>
      </div>

      <div class="chips">
        <span>dma hardware dev</span><span>fortnite cheats</span><span>pro c++</span><span>reverse engineering</span>
      </div>

      <div class="links">
        <a class="main" href="https://larphub.tech" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>larphub.tech</a>
        <a href="https://discord.com/users/1495161901330464801" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>dm me</a>
      </div>

      <div class="player">
        <button class="pbtn" id="pp" type="button" aria-label="Play"></button>
        <div class="bar"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
        <svg class="vic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume">
      </div>

      <p class="foot"><b>dms open</b></p>
    </main>
    <p class="legal">larphub is for entertainment, parody, mockups and content creation only. no real money, not for fraud.</p>
  </div>
</div>

<audio id="au" src="music/song.mp3" preload="auto" loop></audio>

<script>
const $ = id => document.getElementById(id);
const ID = "1495161901330464801";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* typed bio */
const lines = ["dma hardware developer", "fortnite cheat dev", "professional c++ coder", "founder of larphub"], typed = $("typed");
if (reduce) typed.textContent = lines[0];
else {
  let li = 0, ci = 0, del = false;
  (function tick() {
    const w = lines[li];
    typed.textContent = w.slice(0, ci);
    if (!del && ci === w.length) { del = true; return setTimeout(tick, 1800); }
    if (del && ci === 0) { del = false; li = (li + 1) % lines.length; }
    ci += del ? -1 : 1;
    setTimeout(tick, del ? 30 : 70);
  })();
}

/* card tilt (desktop) */
const card = $("card");
if (!reduce && matchMedia("(hover:hover) and (pointer:fine)").matches) {
  card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    card.style.animation = "none"; card.style.opacity = 1;
    card.style.transform = `rotateX(${-y * 6}deg) rotateY(${x * 6}deg)`;
  });
  card.addEventListener("pointerleave", () => { card.style.transform = ""; });
}

/* discord presence (live) */
const LABEL = { online: "online", idle: "idle", dnd: "do not disturb", offline: "offline" };
function render(d) {
  const u = d.discord_user || {};
  if (u.avatar) {
    const url = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_") ? "gif" : "png"}?size=256`;
    $("av").src = url; $("pav").src = url;
  }
  $("pname").textContent = u.global_name || u.display_name || u.username || "Punch";
  const s = d.discord_status || "offline";
  $("dot").className = "dot " + s;
  const acts = d.activities || [], game = acts.find(a => a.type === 0), custom = acts.find(a => a.type === 4);
  let t = LABEL[s] || s;
  if (d.listening_to_spotify && d.spotify) t = "listening to " + d.spotify.song + " by " + d.spotify.artist;
  else if (game) t = "playing " + game.name;
  else if (custom && custom.state) t = custom.state;
  $("pstat").textContent = t;
}
fetch("https://api.lanyard.rest/v1/users/" + ID).then(r => r.json()).then(j => j.success && render(j.data)).catch(() => { $("pstat").textContent = "discord status unavailable"; });
(function connect(retry = 1000) {
  let hb;
  const ws = new WebSocket("wss://api.lanyard.rest/socket");
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.op === 1) { ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: ID } })); hb = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval); }
    else if (m.op === 0) render(m.d[ID] || m.d);
  };
  ws.onclose = () => { clearInterval(hb); setTimeout(() => connect(Math.min(retry * 2, 30000)), retry); };
})();

/* player */
const au = $("au"), pp = $("pp"), seek = $("seek"), vol = $("vol");
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
};
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
const fill = (el, f) => el.style.setProperty("--p", (f * 100) + "%");
au.volume = 0.6;
try { const sv = localStorage.getItem("punch-vol"); if (sv !== null) { au.volume = +sv; vol.value = sv; } } catch (_) {}
fill(vol, au.volume);
const sync = () => { pp.innerHTML = au.paused ? ICON.play : ICON.pause; pp.setAttribute("aria-label", au.paused ? "Play" : "Pause"); };
au.addEventListener("play", sync); au.addEventListener("pause", sync);
pp.onclick = () => au.paused ? au.play().catch(() => {}) : au.pause();
au.addEventListener("loadedmetadata", () => { seek.max = au.duration; $("dur").textContent = fmt(au.duration); });
let drag = false;
seek.addEventListener("pointerdown", () => drag = true); addEventListener("pointerup", () => drag = false);
au.addEventListener("timeupdate", () => { if (drag) return; seek.value = au.currentTime; $("cur").textContent = fmt(au.currentTime); fill(seek, au.currentTime / (au.duration || 1)); });
seek.oninput = () => { au.currentTime = seek.value; $("cur").textContent = fmt(+seek.value); fill(seek, seek.value / (au.duration || 1)); };
vol.oninput = () => { au.volume = vol.value; fill(vol, vol.value); try { localStorage.setItem("punch-vol", vol.value); } catch (_) {} };
au.addEventListener("error", () => document.querySelector(".player").hidden = true);
sync();

/* enter */
const gate = $("gate");
function enter() {
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone"); document.body.classList.remove("locked");
  au.play().catch(() => {}); sync();
}
gate.addEventListener("click", enter);
gate.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
</script>
</body>
</html>
