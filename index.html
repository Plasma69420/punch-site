<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="punch. dma hardware developer. fortnite cheat dev. professional c++ coder. side brand: larp hub.">
<meta name="theme-color" content="#0c0c0c">
<link rel="canonical" href="https://heyimpunch.xyz/">
<meta property="og:type" content="website">
<meta property="og:title" content="PUNCH">
<meta property="og:description" content="dma hardware developer. fortnite cheat dev. professional c++ coder.">
<meta property="og:url" content="https://heyimpunch.xyz/">
<meta property="og:image" content="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=512">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--text:#d4d4d4;--dim:#6f6f6f;--green:#3ddc84;--red:#ff4d4d;--amber:#ffb454;--bass:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 'IBM Plex Mono',ui-monospace,Consolas,monospace;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
::selection{background:var(--green);color:#000}
a{color:var(--green);text-underline-offset:3px}
a:hover{background:var(--green);color:#000}

/* crt */
body::before{content:"";position:fixed;inset:0;z-index:80;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px)}
body::after{content:"";position:fixed;inset:0;z-index:81;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55))}

#gate{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .5s,visibility .5s}
#gate.gone{opacity:0;visibility:hidden}
#gate div{text-align:center;font-family:'VT323',monospace}
#gate b{display:block;font-size:clamp(2.2rem,8vw,4.2rem);font-weight:400;color:var(--green);letter-spacing:.04em;animation:blink 1.1s steps(1) infinite}
#gate span{display:block;margin-top:8px;font-size:1.2rem;color:var(--dim);letter-spacing:.2em}
@keyframes blink{50%{opacity:.15}}

/* terminal screen */
#screen{min-height:100%;padding:22px clamp(14px,3vw,40px) 90px;max-width:960px;margin:0 auto;cursor:text}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.dim{color:var(--dim)}
.g{color:var(--green)}
.r{color:var(--red)}
.a{color:var(--amber)}
.w{color:#fff}
.pr{color:var(--text)}
.pr .path{color:var(--green)}
.big{font-family:'VT323',monospace;font-size:clamp(3.4rem,12vw,7.2rem);line-height:.9;color:var(--green);letter-spacing:.02em;margin:6px 0 10px;text-shadow:0 0 calc(6px + var(--bass)*22px) rgba(61,220,132,.55)}
.row{display:flex;gap:0;flex-wrap:wrap}
.row .k{color:var(--amber);min-width:18ch;white-space:pre}
.cur{display:inline-block;width:.6em;height:1.05em;background:var(--green);vertical-align:-.2em;animation:blink 1s steps(1) infinite}

#live{display:flex;align-items:baseline;flex-wrap:wrap}
#form{display:flex;align-items:baseline;gap:0}
#form .path{color:var(--green);white-space:pre}
#cmd{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;caret-color:var(--green)}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
#chips button{background:none;border:1px solid var(--dim);color:var(--dim);font:inherit;font-size:.78rem;padding:3px 10px;cursor:pointer;transition:all .12s}
#chips button:hover{border-color:var(--green);color:#000;background:var(--green)}

/* now playing bar */
#np{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;align-items:center;gap:14px;padding:8px clamp(14px,3vw,40px);background:#050505;border-top:1px solid #1d1d1d;font-size:.78rem;color:var(--dim)}
#np .eq{color:var(--green);letter-spacing:.02em;white-space:pre;flex:1;min-width:0;overflow:hidden}
#np button{background:none;border:1px solid var(--dim);color:var(--text);font:inherit;padding:2px 10px;cursor:pointer}
#np button:hover{background:var(--green);border-color:var(--green);color:#000}
#np input{width:80px;accent-color:#3ddc84}

@media(max-width:560px){body{font-size:14px}.row .k{min-width:16ch}#np .lbl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body class="locked">

<div id="gate" role="button" tabindex="0" aria-label="Click to boot">
  <div><b>[ click to boot ]</b><span>SOUND ON</span></div>
</div>

<div id="screen">
  <div id="log" aria-live="polite"></div>
  <div id="live">
    <form id="form" autocomplete="off" hidden><span class="path">C:\punch&gt;&nbsp;</span><input id="cmd" aria-label="command" spellcheck="false" autocapitalize="off"></form>
  </div>
  <div id="chips" hidden></div>
</div>

<div id="np"><span class="lbl">&#9834; now playing</span><span class="eq" id="eq" aria-hidden="true"></span><button id="pp" type="button">pause</button><input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume"></div>

<audio id="au" src="music/song.mp3" preload="auto" loop></audio>

<script>
const $ = id => document.getElementById(id);
const ID = "1495161901330464801", DISCORD = "https://discord.com/users/" + ID;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const root = document.documentElement, log = $("log"), form = $("form"), input = $("cmd");
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const scrollEnd = () => window.scrollTo(0, document.body.scrollHeight);

/* ---------- printing helpers ---------- */
function line(text = "", cls = "") { const d = document.createElement("div"); d.className = "ln " + cls; d.textContent = text; log.append(d); scrollEnd(); return d; }
function html(build) { const d = document.createElement("div"); d.className = "ln"; build(d); log.append(d); scrollEnd(); return d; }
function span(t, c) { const s = document.createElement("span"); if (c) s.className = c; s.textContent = t; return s; }
function link(label, href) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = label; return a; }
function kv(k, v, vc) { return html(d => { d.className = "ln row"; d.append(span(k, "k"), span(v, vc || "")); }); }
async function typeInto(el, text, speed = 14) { for (const ch of text) { el.textContent += ch; if (!reduce) await sleep(speed); } scrollEnd(); }
async function typeLine(text, cls = "", speed = 12) { const d = line("", cls); await typeInto(d, text, speed); return d; }

/* ---------- commands ---------- */
const COMMANDS = {
  help() {
    line("available commands:", "dim");
    [["whoami", "who i am"], ["about", "what i do"], ["skills", "what i work with"], ["larphub", "my side brand"], ["status", "live discord status"], ["contact", "how to reach me"], ["song", "play / pause the track"], ["clear", "clear the screen"]].forEach(([k, v]) => kv("  " + k, v));
  },
  whoami() { line("punch", "w"); line("dma hardware developer. fortnite cheat dev. professional c++ coder.", "g"); },
  about() {
    line("about.txt", "dim");
    line("");
    line("i'm punch. i'm a dma hardware developer and i make fortnite cheats.");
    line("i'm a professional c++ coder, and i do reverse engineering.");
    line("my side brand is larp hub.");
    line("");
    line("dms are open.", "g");
  },
  skills() {
    line("skills/", "dim");
    kv("  c++", "professional", "g");
    kv("  dma hardware", "developer", "g");
    kv("  game cheats", "fortnite", "g");
    kv("  reverse eng.", "yes", "g");
    kv("  also", "c#, python, javascript");
  },
  larphub() {
    line("larp hub  (side brand)", "w");
    line("formerly larp central. a library of photos and videos, prompts, tools and a private discord for people who larp.");
    line("entertainment, parody, mockups and content creation only. no real money, not for fraud.", "dim");
    html(d => d.append(span("> ", "g"), link("larphub.tech", "https://larphub.tech")));
  },
  status() { line(statusText(), "g"); },
  contact() { html(d => d.append(span("discord  ", "a"), link("message me", DISCORD))); line("dms are open.", "dim"); },
  discord() { COMMANDS.contact(); },
  song() { if (au.paused) { au.play().then(() => line("playing.", "g")).catch(() => line("click the page first, then try again.", "r")); } else { au.pause(); line("paused.", "dim"); } },
  clear() { log.replaceChildren(); },
  ls() { line("about.txt   skills/   larphub.txt   contact.txt"); },
  cat(arg) {
    const f = (arg || "").replace(/\.txt$/, "");
    if (f === "about") return COMMANDS.about();
    if (f === "larphub") return COMMANDS.larphub();
    if (f === "contact") return COMMANDS.contact();
    line(arg ? "cat: " + arg + ": no such file" : "usage: cat <file>", "r");
  },
  sudo() { line("nice try.", "r"); },
  exit() { line("there is no escape.", "dim"); },
};
const ORDER = Object.keys(COMMANDS);
const history = []; let hi = 0;

function run(raw) {
  const t = raw.trim();
  if (!t) return;
  const [base, ...rest] = t.split(/\s+/);
  const fn = COMMANDS[base.toLowerCase()];
  fn ? fn(rest.join(" ")) : line("'" + base + "' is not recognized. type help.", "r");
  scrollEnd();
}
function echo(cmd) { html(d => { d.className = "ln pr"; d.append(span("C:\\punch> ", "path"), document.createTextNode(cmd)); }); }

form.addEventListener("submit", e => {
  e.preventDefault();
  const v = input.value; input.value = "";
  echo(v);
  if (v.trim()) { history.push(v); hi = history.length; }
  run(v);
});
input.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") { e.preventDefault(); if (hi > 0) input.value = history[--hi]; }
  else if (e.key === "ArrowDown") { e.preventDefault(); input.value = hi < history.length - 1 ? history[++hi] : (hi = history.length, ""); }
  else if (e.key === "Tab") { e.preventDefault(); const m = ORDER.filter(c => c.startsWith(input.value.toLowerCase())); if (m.length === 1) input.value = m[0]; }
  else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); COMMANDS.clear(); }
});
$("screen").addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });

/* chips (for phones) */
["help", "whoami", "about", "skills", "larphub", "status", "song"].forEach(n => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = n;
  b.onclick = () => { echo(n); run(n); };
  $("chips").append(b);
});

/* ---------- discord status ---------- */
const LABEL = { online: "online", idle: "idle", dnd: "do not disturb", offline: "offline" };
let presence = null;
function statusText() {
  if (!presence) return "discord: connecting...";
  const s = presence.discord_status || "offline", acts = presence.activities || [];
  const game = acts.find(a => a.type === 0), custom = acts.find(a => a.type === 4);
  let t = "discord: " + (LABEL[s] || s);
  if (presence.listening_to_spotify && presence.spotify) t += " | listening to " + presence.spotify.song + " by " + presence.spotify.artist;
  else if (game) t += " | playing " + game.name;
  else if (custom && custom.state) t += " | " + custom.state;
  return t;
}
const setP = d => { presence = d; };
fetch("https://api.lanyard.rest/v1/users/" + ID).then(r => r.json()).then(j => j.success && setP(j.data)).catch(() => {});
(function connect(retry = 1000) {
  let hb;
  const ws = new WebSocket("wss://api.lanyard.rest/socket");
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.op === 1) { ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: ID } })); hb = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval); }
    else if (m.op === 0) setP(m.d[ID] || m.d);
  };
  ws.onclose = () => { clearInterval(hb); setTimeout(() => connect(Math.min(retry * 2, 30000)), retry); };
})();

/* ---------- audio + ascii visualizer ---------- */
const au = $("au"), pp = $("pp"), vol = $("vol"), eq = $("eq"), BLOCKS = "\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588";
let actx, analyser, data, hasAnalyser = false;
au.volume = 0.6;
try { const sv = localStorage.getItem("punch-vol"); if (sv !== null) { au.volume = +sv; vol.value = sv; } } catch (_) {}
function setupAnalyser() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; actx = new AC();
    const src = actx.createMediaElementSource(au);
    analyser = actx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = .78;
    src.connect(analyser); analyser.connect(actx.destination);
    data = new Uint8Array(analyser.frequencyBinCount); hasAnalyser = true;
  } catch (_) { hasAnalyser = false; }
}
function frame(t) {
  const n = Math.max(12, Math.min(48, Math.floor((innerWidth - 220) / 11)));
  let s = "", bass = 0;
  const playing = !au.paused;
  if (playing && hasAnalyser) { analyser.getByteFrequencyData(data); for (let i = 0; i < 5; i++) bass += data[i]; bass = Math.min(1, bass / 5 / 255 * 1.1); }
  for (let i = 0; i < n; i++) {
    let v = 0.02;
    if (playing) v = hasAnalyser ? data[Math.floor(i * 0.9) + 1] / 255 : (Math.sin(t / 200 + i * .6) + 1) / 2.4;
    s += BLOCKS[Math.min(7, Math.floor(v * 8))];
  }
  eq.textContent = s;
  root.style.setProperty("--bass", reduce ? 0 : bass.toFixed(3));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const syncBtn = () => { pp.textContent = au.paused ? "play" : "pause"; };
au.addEventListener("play", syncBtn); au.addEventListener("pause", syncBtn);
pp.onclick = () => { if (actx && actx.state === "suspended") actx.resume(); au.paused ? au.play().catch(() => {}) : au.pause(); };
vol.oninput = () => { au.volume = vol.value; try { localStorage.setItem("punch-vol", vol.value); } catch (_) {} };
au.addEventListener("error", () => { $("np").hidden = true; });
syncBtn();

/* ---------- boot ---------- */
let booted = false;
async function autorun(cmd) {
  const d = html(x => { x.className = "ln pr"; x.append(span("C:\\punch> ", "path")); });
  const t = document.createTextNode(""); d.append(t);
  for (const ch of cmd) { t.textContent += ch; await sleep(55); }
  await sleep(220);
  run(cmd);
  await sleep(260);
}
async function boot() {
  if (booted) return; booted = true;
  await typeLine("punch os [version 1.0.2026]", "dim", 8);
  await typeLine("(c) punch. all rights reserved.", "dim", 8);
  line("");
  const big = line("PUNCH", "big"); big.style.whiteSpace = "pre";
  await sleep(250);
  await typeLine("dma hardware developer  //  fortnite cheat dev  //  professional c++ coder", "a", 8);
  line("");
  await autorun("whoami");
  line("");
  await autorun("about");
  line("");
  await autorun("larphub");
  line("");
  line("type help for commands.", "dim");
  form.hidden = false; $("chips").hidden = false;
  input.focus({ preventScroll: true }); scrollEnd();
}

const gate = $("gate");
function enter() {
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone"); document.body.classList.remove("locked");
  if (!actx) setupAnalyser();
  if (actx && actx.state === "suspended") actx.resume();
  au.play().catch(() => {}); syncBtn();
  boot();
}
gate.addEventListener("click", enter);
gate.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
</script>
</body>
</html>
