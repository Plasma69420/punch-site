<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>punch</title>
<meta name="description" content="punch. dma hardware developer, fortnite cheats, professional c++ coder. founder of larphub.">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://heyimpunch.xyz/">
<meta property="og:type" content="website">
<meta property="og:title" content="punch">
<meta property="og:description" content="dma hardware developer, fortnite cheats, professional c++ coder. founder of larphub.">
<meta property="og:url" content="https://heyimpunch.xyz/">
<meta property="og:image" content="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=512">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#eceae4;font:400 14px/1.65 'IBM Plex Mono',ui-monospace,Consolas,monospace;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
::selection{background:#eceae4;color:#000}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.bg{position:fixed;inset:-10px;z-index:-2;background:#000 url("img/bg.jpg") center/cover no-repeat;filter:blur(2px) brightness(.6)}
.bg video{width:100%;height:100%;object-fit:cover;display:block}
.shade{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.25)}

#gate{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .5s,visibility .5s}
#gate.gone{opacity:0;visibility:hidden}

.page{min-height:100svh;display:grid;place-items:center;padding:24px 14px}
.card{width:min(430px,100%);background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.22);border-radius:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:24px}

/* top: avatar + name */
.head{display:flex;gap:16px;align-items:center}
.av{position:relative;flex:none;width:72px;height:72px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1a1a1a;display:block}
.name{font-family:'Archivo Black','Arial Black',Impact,sans-serif;font-weight:400;font-size:2.4rem;line-height:1;letter-spacing:-.02em;text-transform:uppercase}
.sub{margin-top:6px;opacity:.7}

/* status line */
.stat{display:flex;align-items:center;gap:9px;margin-top:20px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.22);font-size:.82rem}
.stat i{width:9px;height:9px;border-radius:50%;background:#777;flex:none}
.stat i.online{background:#3ba55d}.stat i.idle{background:#faa61a}.stat i.dnd{background:#e0433f}
.stat span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* text */
.txt{margin-top:18px;font-size:1rem;line-height:1.55}
.txt p+p{margin-top:2px}
.note{margin-top:14px;font-size:.72rem;opacity:.6}

/* links */
.links{display:flex;gap:10px;margin-top:20px}
.links a{flex:1;text-align:center;padding:11px 12px;border:1px solid #eceae4;border-radius:3px;text-decoration:none;font-weight:500;transition:background .12s,color .12s}
.links a.fill{background:#eceae4;color:#000}
.links a:hover{background:#fff;color:#000}
.links a.fill:hover{background:transparent;color:#eceae4}

/* player */
.player{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:.78rem}
.player button{text-decoration:underline;text-underline-offset:4px;min-width:5ch;text-align:left}
.player button:hover{background:#eceae4;color:#000;text-decoration:none}
.player .t{font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:18px;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,#eceae4 var(--p),rgba(236,234,228,.28) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;background:#eceae4;margin-top:-3px;border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:rgba(236,234,228,.28)}
input[type=range]::-moz-range-progress{height:2px;background:#eceae4}
input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:0;background:#eceae4}
#seek{flex:1;min-width:0}
#vol{width:52px;flex:none}

.foot{margin-top:18px;font-size:.74rem;opacity:.65;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:420px){.card{padding:20px}.name{font-size:2rem}.av{width:62px;height:62px}#vol{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">
<div class="bg" aria-hidden="true"><video id="bgv" src="media/bg.mp4" poster="img/bg.jpg" autoplay muted loop playsinline preload="auto"></video></div>
<div class="shade" aria-hidden="true"></div>

<div id="gate" role="button" tabindex="0" aria-label="Click to enter">click to enter</div>

<div class="page">
  <main class="card">

    <div class="head">
      <div class="av"><img id="av" alt="punch" src="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=256"></div>
      <div>
        <h1 class="name">punch</h1>
        <p class="sub">founder of larphub</p>
      </div>
    </div>

    <div class="stat" aria-live="polite"><i id="dot"></i><span id="pstat">connecting...</span></div>

    <div class="txt">
      <p>dma hardware developer.</p>
      <p>i make fortnite cheats.</p>
      <p>professional c++ coder.</p>
    </div>

    <div class="links">
      <a class="fill" href="https://larphub.tech" target="_blank" rel="noopener">larphub.tech</a>
      <a href="https://discord.com/users/1495161901330464801" target="_blank" rel="noopener">discord</a>
    </div>

    <div class="player" id="player">
      <button id="pp" type="button">play</button>
      <span class="t"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume">
    </div>

    <div class="foot"><span id="views" hidden><b id="vn">0</b> views</span><span>dms open</span></div>
    <p class="note">larphub is for entertainment, parody, mockups and content creation only. no real money, not for fraud.</p>
  </main>
</div>

<audio id="au" src="music/song.mp3" preload="auto" loop></audio>

<script>
const $ = id => document.getElementById(id);
const ID = "1495161901330464801";

/* discord presence */
const LABEL = { online: "online", idle: "idle", dnd: "do not disturb", offline: "offline" };
function render(d) {
  const u = d.discord_user || {};
  if (u.avatar) $("av").src = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_") ? "gif" : "png"}?size=256`;
  const s = d.discord_status || "offline";
  $("dot").className = s;
  const acts = d.activities || [], game = acts.find(a => a.type === 0), custom = acts.find(a => a.type === 4);
  let t = LABEL[s] || s;
  if (d.listening_to_spotify && d.spotify) t += " · listening to " + d.spotify.song + " by " + d.spotify.artist;
  else if (game) t += " · playing " + game.name;
  else if (custom && custom.state) t += " · " + custom.state;
  $("pstat").textContent = t;
}
fetch("https://api.lanyard.rest/v1/users/" + ID).then(r => r.json()).then(j => j.success && render(j.data)).catch(() => { $("pstat").textContent = "status unavailable"; });
(function connect(retry = 1000) {
  let hb;
  const ws = new WebSocket("wss://api.lanyard.rest/socket");
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.op === 1) { ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: ID } })); hb = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval); }
    else if (m.op === 0) render(m.d[ID] || m.d);
  };
  ws.onclose = () => { clearInterval(hb); setTimeout(() => connect(Math.min(retry * 2, 30000)), retry); };
})();

/* player */
const au = $("au"), pp = $("pp"), seek = $("seek"), vol = $("vol");
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
const fill = (el, f) => el.style.setProperty("--p", (f * 100) + "%");
au.volume = 0.6;
try { const sv = localStorage.getItem("punch-vol"); if (sv !== null) { au.volume = +sv; vol.value = sv; } } catch (_) {}
fill(vol, au.volume);
const sync = () => { pp.textContent = au.paused ? "play" : "pause"; };
au.addEventListener("play", sync); au.addEventListener("pause", sync);
pp.onclick = () => au.paused ? au.play().catch(() => {}) : au.pause();
function setDur() {
  if (!isFinite(au.duration) || au.duration <= 0) return;
  if (+seek.max !== au.duration) seek.max = au.duration;
  $("dur").textContent = fmt(au.duration);
}
["loadedmetadata", "durationchange", "loadeddata", "canplay"].forEach(ev => au.addEventListener(ev, setDur));
setDur();
let drag = false;
seek.addEventListener("pointerdown", () => drag = true); addEventListener("pointerup", () => drag = false);
au.addEventListener("timeupdate", () => {
  setDur();
  if (drag) return;
  seek.value = au.currentTime; $("cur").textContent = fmt(au.currentTime); fill(seek, au.currentTime / (au.duration || 1));
});
seek.oninput = () => { au.currentTime = seek.value; $("cur").textContent = fmt(+seek.value); fill(seek, seek.value / (au.duration || 1)); };
vol.oninput = () => { au.volume = vol.value; fill(vol, vol.value); try { localStorage.setItem("punch-vol", vol.value); } catch (_) {} };
au.addEventListener("error", () => $("player").hidden = true);
sync();

/* view counter: once per browser session, only on the real domain */
(async () => {
  try {
    let first = false;
    try { first = location.hostname === "heyimpunch.xyz" && !sessionStorage.getItem("hp-view"); } catch (_) {}
    const r = await fetch("https://abacus.jasoncameron.dev/" + (first ? "hit" : "get") + "/heyimpunch-xyz/visits");
    const j = await r.json();
    if (typeof j.value !== "number") throw 0;
    try { if (first) sessionStorage.setItem("hp-view", "1"); } catch (_) {}
    $("vn").textContent = j.value.toLocaleString();
    $("views").hidden = false;
  } catch (_) { /* counter down: keep it hidden */ }
})();

/* enter */
const gate = $("gate");
function enter() {
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone"); document.body.classList.remove("locked");
  au.play().catch(() => {}); sync();
  $("bgv").play().catch(() => {});
}
$("bgv").play().catch(() => {});
gate.addEventListener("click", enter);
gate.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
</script>
</body>
</html>
