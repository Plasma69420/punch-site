<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>punch</title>
<meta name="description" content="punch. dma hardware dev, fortnite cheats, c++. side brand: larphub.">
<meta name="theme-color" content="#0c0c0c">
<link rel="canonical" href="https://heyimpunch.xyz/">
<meta property="og:type" content="website">
<meta property="og:title" content="punch">
<meta property="og:description" content="dma hardware dev, fortnite cheats, c++.">
<meta property="og:url" content="https://heyimpunch.xyz/">
<meta property="og:image" content="https://cdn.discordapp.com/avatars/1495161901330464801/8389a180a89b59dae233193cd0fb688e.png?size=512">
<meta name="twitter:card" content="summary">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0c0c0c;color:#ccc;font:16px/1.4 "Cascadia Mono",Consolas,"Lucida Console","DejaVu Sans Mono",monospace;overflow-x:hidden}
body.locked{overflow:hidden}
::selection{background:#ccc;color:#0c0c0c}
a{color:inherit;text-decoration:underline}
a:hover{background:#ccc;color:#0c0c0c}

#gate{position:fixed;inset:0;z-index:10;background:#0c0c0c;padding:16px;cursor:pointer}
#gate.gone{display:none}

#screen{min-height:100%;padding:36px 28px 90px;max-width:820px;margin:0 auto;cursor:text}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.4em}
.kv{display:flex;gap:0;margin-left:2ch}
.kv .k{flex:0 0 14ch;color:#888}
.kv .v{flex:1;min-width:0;word-break:break-word}
.rule{border-bottom:1px solid #444;margin:6px 0 12px}
.dim{color:#888}
.gap{height:1.4em}
.cmdline{margin-top:18px}
#form{display:flex}
#form .p{white-space:pre}
#cmd{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;caret-color:#ccc;border-radius:0}
.q{margin-top:14px}
.q button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;margin-right:14px}
.q button:hover{background:#ccc;color:#0c0c0c}

#np{position:fixed;left:0;right:0;bottom:0;padding:8px 16px;background:#0c0c0c;border-top:1px solid #333;font-size:14px;display:flex;gap:14px;align-items:center}
#np button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline}
#np button:hover{background:#ccc;color:#0c0c0c}
#np input{width:90px;accent-color:#ccc}
</style>
</head>
<body class="locked">

<div id="gate" role="button" tabindex="0" aria-label="Click to start">click anywhere to start. sound on.</div>

<div id="screen">
  <div id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off" hidden><span class="p">C:\punch&gt;&nbsp;</span><input id="cmd" aria-label="command" spellcheck="false" autocapitalize="off"></form>
  <div class="q" id="quick" hidden></div>
</div>

<div id="np"><span>song.mp3</span><button id="pp" type="button">[pause]</button><input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume"></div>
<audio id="au" src="music/song.mp3" preload="auto" loop></audio>

<script>
const $ = id => document.getElementById(id);
const ID = "1495161901330464801", DISCORD = "https://discord.com/users/" + ID;
const log = $("log"), form = $("form"), input = $("cmd"), au = $("au");
const end = () => window.scrollTo(0, document.body.scrollHeight);

function line(t = "", cls = "") { const d = document.createElement("div"); d.className = "ln " + cls; d.textContent = t; log.append(d); end(); }
function gap() { const d = document.createElement("div"); d.className = "gap"; log.append(d); }
function rule() { const d = document.createElement("div"); d.className = "rule"; log.append(d); }
/* label / value row. value can be text or {href, label} */
function kv(k, v) {
  const d = document.createElement("div"); d.className = "kv";
  const a = document.createElement("span"); a.className = "k"; a.textContent = k;
  const b = document.createElement("span"); b.className = "v";
  if (v && v.href) { const l = document.createElement("a"); l.href = v.href; l.target = "_blank"; l.rel = "noopener"; l.textContent = v.label || v.href; b.append(l); }
  else b.textContent = v;
  d.append(a, b); log.append(d); end();
}

const COMMANDS = {
  help() {
    line("commands", "dim"); rule();
    kv("about", "who i am");
    kv("skills", "what i work with");
    kv("larphub", "my side brand");
    kv("status", "discord status");
    kv("discord", "contact me");
    kv("song", "play / pause");
    kv("clear", "clear the screen");
  },
  about() {
    line("about", "dim"); rule();
    kv("name", "punch");
    kv("role", "dma hardware developer");
    kv("", "fortnite cheat developer");
    kv("", "professional c++ coder");
    kv("", "reverse engineering");
    kv("side brand", "larphub");
    kv("contact", "discord, dms open");
  },
  skills() {
    line("skills", "dim"); rule();
    kv("c++", "professional");
    kv("dma hardware", "developer");
    kv("game cheats", "fortnite");
    kv("reverse eng.", "yes");
    kv("also", "c#, python, javascript");
  },
  larphub() {
    line("larphub (side brand)", "dim"); rule();
    kv("what", "photo and video library, prompts, tools, private discord");
    kv("formerly", "larp central");
    kv("site", { href: "https://larphub.tech", label: "larphub.tech" });
    kv("note", "entertainment, parody and mockups only. no real money, not for fraud.");
  },
  status() { line("status", "dim"); rule(); kv("discord", statusText()); },
  discord() { line("contact", "dim"); rule(); kv("discord", { href: DISCORD, label: "message me" }); kv("dms", "open"); },
  song() { if (au.paused) au.play().catch(() => line("click the page first.")); else au.pause(); },
  clear() { log.replaceChildren(); },
  dir() { line("files", "dim"); rule(); kv("about", "who i am"); kv("skills", "what i work with"); kv("larphub", "my side brand"); kv("discord", "contact me"); },
};
COMMANDS.ls = COMMANDS.dir; COMMANDS.cls = COMMANDS.clear; COMMANDS.contact = COMMANDS.discord; COMMANDS.whoami = COMMANDS.about;
const NAMES = Object.keys(COMMANDS);
const hist = []; let hi = 0;

function echo(c) { line("C:\\punch> " + c, "cmdline"); }
function run(raw) {
  const t = raw.trim(); if (!t) return;
  const base = t.split(/\s+/)[0].toLowerCase();
  gap();
  COMMANDS[base] ? COMMANDS[base]() : line("'" + base + "' is not recognized. type help.");
  end();
}
form.addEventListener("submit", e => {
  e.preventDefault();
  const v = input.value; input.value = "";
  echo(v); if (v.trim()) { hist.push(v); hi = hist.length; }
  run(v);
});
input.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") { e.preventDefault(); if (hi > 0) input.value = hist[--hi]; }
  else if (e.key === "ArrowDown") { e.preventDefault(); input.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ""); }
  else if (e.key === "Tab") { e.preventDefault(); const m = NAMES.filter(c => c.startsWith(input.value.toLowerCase())); if (m.length === 1) input.value = m[0]; }
});
$("screen").addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });

["help", "about", "skills", "larphub", "status", "song"].forEach(n => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = n;
  b.onclick = () => { echo(n); run(n); }; $("quick").append(b);
});

/* discord status */
let presence = null;
const LABEL = { online: "online", idle: "idle", dnd: "do not disturb", offline: "offline" };
function statusText() {
  if (!presence) return "connecting...";
  const s = presence.discord_status || "offline", acts = presence.activities || [];
  const game = acts.find(a => a.type === 0), custom = acts.find(a => a.type === 4);
  let t = LABEL[s] || s;
  if (presence.listening_to_spotify && presence.spotify) t += ", listening to " + presence.spotify.song + " by " + presence.spotify.artist;
  else if (game) t += ", playing " + game.name;
  else if (custom && custom.state) t += ", " + custom.state;
  return t;
}
fetch("https://api.lanyard.rest/v1/users/" + ID).then(r => r.json()).then(j => { if (j.success) presence = j.data; }).catch(() => {});
(function connect(retry = 1000) {
  let hb;
  const ws = new WebSocket("wss://api.lanyard.rest/socket");
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.op === 1) { ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: ID } })); hb = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval); }
    else if (m.op === 0) presence = m.d[ID] || m.d;
  };
  ws.onclose = () => { clearInterval(hb); setTimeout(() => connect(Math.min(retry * 2, 30000)), retry); };
})();

/* audio */
const pp = $("pp"), vol = $("vol");
au.volume = 0.6;
try { const sv = localStorage.getItem("punch-vol"); if (sv !== null) { au.volume = +sv; vol.value = sv; } } catch (_) {}
const sync = () => { pp.textContent = au.paused ? "[play]" : "[pause]"; };
au.addEventListener("play", sync); au.addEventListener("pause", sync);
pp.onclick = () => au.paused ? au.play().catch(() => {}) : au.pause();
vol.oninput = () => { au.volume = vol.value; try { localStorage.setItem("punch-vol", vol.value); } catch (_) {} };
au.addEventListener("error", () => { $("np").hidden = true; });
sync();

/* start */
const gate = $("gate");
function start() {
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone"); document.body.classList.remove("locked");
  au.play().catch(() => {}); sync();
  line("punch [version 1.0]");
  line("type help for commands.", "dim");
  echo("about"); run("about");
  form.hidden = false; $("quick").hidden = false;
  input.focus({ preventScroll: true });
}
gate.addEventListener("click", start);
gate.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") start(); });
</script>
</body>
</html>
